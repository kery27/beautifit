<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>네일 미러</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 네일 미러 — 헤어 미러와 같은 살롱 톤. 손 사진이 화면을 채우고, 시안·컬러·모양 도구는 아래 유리판에
   PICTURE: 시안을 올린 손 사진 자체가 그림
   COLOUR and TYPE: 짙은 자두색 바탕, 민트 실행 버튼, 흰 글자 / 제목 Gowun Batang, 본문 Noto Sans KR
   LAYOUT: 모바일 한 화면(데스크톱은 가운데 520px). 위: 사진·카메라·토큰, 아래: 탭+조절+변신 */
:root{color-scheme:dark;--plum:#5e1f3a;--mint:#1f9e89;--mint2:#2bbfa5;--gold:#d9b35a;--glass:rgba(20,11,16,.8);--line:rgba(255,255,255,.16);--sub:rgba(255,255,255,.74)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1c0f16;color:#fff;font:16px/1.5 "Noto Sans KR",system-ui,sans-serif;overflow:hidden}
button,label.btn{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,label:focus-within,input:focus-visible{outline:3px solid var(--mint2);outline-offset:2px}
.app{position:relative;height:100dvh;max-width:520px;margin:auto;overflow:hidden;background:#0d090b;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#cv.flip{transform:scaleX(-1)}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
/* 위쪽 바 */
.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 12px 18px;background:linear-gradient(rgba(0,0,0,.55),transparent);z-index:3}
.top[hidden]{display:none}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 15px;border-radius:99px;border:1px solid var(--line);background:rgba(0,0,0,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:14px;font-weight:500;white-space:nowrap}
.sp{flex:1}
.coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4,#d9b35a 55%,#a27b25);box-shadow:inset 0 0 0 2px rgba(120,80,10,.35)}
.tok b{font-variant-numeric:tabular-nums}
.tok.zero{border-color:#e06a6a;background:rgba(120,20,30,.55)}
.zoom{position:absolute;right:12px;top:calc(max(10px,env(safe-area-inset-top)) + 58px);display:grid;gap:8px;z-index:3}
.zoom[hidden]{display:none}
.zoom button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:21px;line-height:1}
.zoom #zfit{font-size:12px;font-weight:700}
#status,.badge{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(10px,env(safe-area-inset-top)) + 58px);z-index:3;white-space:nowrap;border-radius:99px;font-size:13px;padding:7px 14px}
#status{background:rgba(0,0,0,.65)}#status:empty{display:none}
.badge{font-weight:700;background:var(--mint);box-shadow:0 6px 18px -6px rgba(0,0,0,.6)}
.badge.demo{background:var(--gold);color:#2a1c05}.badge[hidden]{display:none}
/* 처음 화면 */
.empty{position:absolute;inset:0;z-index:4;display:grid;align-content:center;justify-items:center;gap:14px;padding:32px 26px max(32px,env(safe-area-inset-bottom));text-align:center;
  background:radial-gradient(120% 80% at 50% 0%,#7a2a4c 0%,#3a1424 55%,#1c0b13 100%)}
.empty[hidden]{display:none}
.empty h1{font:700 44px/1.05 "Gowun Batang",serif;margin:0}
.empty p{margin:0;color:var(--sub);max-width:22em}
.mirrorart{width:150px;height:190px;border-radius:90px 90px 16px 16px;border:6px solid rgba(255,255,255,.85);background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,.03));position:relative;margin-bottom:6px}
.mirrorart::after{content:"";position:absolute;left:22px;top:26px;width:26px;height:110px;border-radius:20px;background:rgba(255,255,255,.18);transform:rotate(10deg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;width:min(320px,100%);border-radius:16px;border:0;background:var(--mint);font-size:18px;font-weight:700;position:relative}
.btn.ghost{background:transparent;border:1.5px solid rgba(255,255,255,.7)}
.tiny{font-size:13px}
/* 아래 편집판 */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:3;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:8px 12px max(10px,env(safe-area-inset-bottom));display:grid;gap:8px;
  height:calc(100% / 3);grid-template-rows:auto minmax(0,1fr) auto}
.sheet.folded{height:auto;grid-template-rows:auto auto}
.rsheet{height:auto;max-height:calc(100% / 3);grid-template-rows:none}
.sheet[hidden]{display:none}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:rgba(255,255,255,.08);border-radius:14px;padding:4px}
.tabs button{min-height:40px;border:0;border-radius:11px;background:transparent;font-size:15px;font-weight:500;color:var(--sub)}
.tabs button[aria-selected=true]{background:#fff;color:#3b1426;font-weight:700}
.pane{min-height:0;overflow:hidden}
.pane[hidden]{display:none}
.scroll{display:flex;gap:8px;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;padding:0 2px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;height:100%;min-width:76px;scroll-snap-align:start;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:3px;justify-items:center;border:2px solid transparent;border-radius:14px;background:rgba(255,255,255,.07);padding:4px 4px 5px;font-size:13px;line-height:1.2;text-align:center;white-space:nowrap}
.card canvas{height:100%;width:auto;aspect-ratio:6/7;border-radius:10px;background:#eadfda}
.card[aria-pressed=true]{border-color:var(--mint2);background:rgba(43,191,165,.16)}
.colors{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 4px;scrollbar-width:none}
.colors::-webkit-scrollbar{display:none}
.dot{flex:0 0 48px;height:48px;border-radius:50%;border:3px solid rgba(0,0,0,.35);box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.dot[aria-pressed=true]{box-shadow:0 0 0 3px var(--mint2),0 0 0 6px rgba(43,191,165,.3)}
.dot.orig{background:conic-gradient(#3a2418,#b0754a,#e3c38f,#1f1916,#8c5458,#3a2418)}
.cname{font-size:14px;color:var(--sub);margin:6px 2px 0}
.cname b{color:#fff}
.rows{display:grid;gap:8px}
.r{display:grid;grid-template-columns:44px minmax(0,1fr) 44px 3.2em;align-items:center;gap:8px;font-size:15px}
.posbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr 1.6fr;gap:4px;background:rgba(255,255,255,.08);border-radius:12px;padding:3px}
.seg button{min-height:38px;border:0;border-radius:9px;background:transparent;color:var(--sub);font-size:14px;font-weight:500;white-space:nowrap;padding:0 4px}
.seg button[aria-pressed=true]{background:#fff;color:#3b1426;font-weight:700}
.seg button.pm[aria-pressed=true]{background:var(--mint);color:#fff}
.mini{min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);font-size:14px;white-space:nowrap}
.pmhint{margin:0;min-height:44px;display:flex;align-items:center;gap:8px;font-size:14px;color:#dff6f1}
.pmhint[hidden]{display:none}.r[hidden]{display:none}
.r output{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums;font-size:14px}
.step{height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);font-size:22px;line-height:1}
input[type=range]{width:100%;height:44px;accent-color:var(--mint2);background:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.soft{min-height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);font-size:15px}
.holdbig{min-height:44px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.12);font-size:16px;font-weight:700;width:100%;user-select:none;-webkit-user-select:none}
.holdbig.on{background:#fff;color:#3b1426}
.hint{font-size:13px;color:var(--sub);margin:0 2px}
.acts{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:8px}
.morph{min-height:50px;border:0;border-radius:14px;background:var(--mint);display:grid;place-content:center;gap:0;line-height:1.2;box-shadow:0 10px 24px -12px rgba(31,158,137,.9)}
.morph b{font-size:17px}
.morph small{font-size:13px;opacity:.9}
.morph[aria-disabled=true]{background:#4b3f45;box-shadow:none}
.soft[aria-disabled=true]{opacity:.55}
.rsheet p{margin:0 4px;font-size:13px;line-height:1.4;color:var(--sub)}
.save{min-height:50px;border-radius:14px;border:1.5px solid rgba(255,255,255,.55);background:transparent;font-size:16px;font-weight:700}
.savebig{min-height:48px;border-radius:12px;border:0;background:var(--mint);font-size:15px;font-weight:700}
.soft[aria-pressed=true]{background:var(--mint);border-color:var(--mint);color:#fff;font-weight:700}
#cv.pm{cursor:move}
.pbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sh,260px) + 12px);z-index:3;display:flex;align-items:center;gap:10px;
  padding:5px 5px 5px 14px;border-radius:99px;background:rgba(31,158,137,.92);box-shadow:0 6px 18px -6px rgba(0,0,0,.6);font-size:14px;font-weight:500;white-space:nowrap}
.pbar[hidden]{display:none}
.pbar button{min-height:36px;padding:0 14px;border-radius:99px;border:0;background:#fff;color:#0f5c50;font-size:14px;font-weight:700}
.rsheet .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.rsheet .three .soft{min-height:48px;display:grid;place-content:center;line-height:1.2}
.rsheet .three small{font-size:13px;opacity:.75}
/* 바쁨 표시 */
.busy{position:absolute;inset:0;z-index:5;display:grid;place-content:center;justify-items:center;gap:10px;text-align:center;background:rgba(10,5,8,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.busy[hidden]{display:none}
.ring{width:64px;height:64px;border-radius:50%;border:5px solid rgba(255,255,255,.2);border-top-color:var(--mint2);animation:spin 1s linear infinite}
.busy b{font-size:18px}.busy span{font-size:14px;color:var(--sub)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ring{animation-duration:3s}}
/* 확인·토큰 창 (아래에서 올라오는 밝은 카드) */
.modal{position:absolute;inset:0;z-index:6;background:rgba(0,0,0,.55);display:grid;align-items:end}
.modal[hidden]{display:none}
.mcard{background:#fbf7f4;color:#201a1d;border-radius:24px 24px 0 0;padding:22px 20px max(20px,env(safe-area-inset-bottom));display:grid;gap:12px;max-height:88dvh;overflow:auto}
.mcard h2{font:700 24px/1.2 "Gowun Batang",serif;margin:0}
.mcard p{margin:0;font-size:15px;color:#4a3d43}
.mcard .note{font-size:13px;color:#6d5f65;background:#f1e9e5;border-radius:12px;padding:10px 12px}
.mcard .note.demo{background:#f6ecd2;color:#5c4510}
.dots{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dots i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4,#d9b35a 55%,#a27b25)}
.dots i.used{background:#e3d9d5}
.dots i.next{outline:3px solid #e06a6a;outline-offset:1px}
.dots span{margin-left:6px;font-size:14px;color:#4a3d43;font-variant-numeric:tabular-nums}
.mbtns{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.mbtns.one{grid-template-columns:1fr}
.mbtns button{min-height:54px;border-radius:14px;border:1.5px solid #cdbfba;background:#fff;font-size:16px;font-weight:700;color:#3b1426}
.mbtns .go{background:var(--mint);border-color:var(--mint);color:#fff}
.mbtns .go:disabled{background:#b9aeb2;border-color:#b9aeb2}
.hist{margin:0;padding:0;list-style:none;font-size:13px;color:#6d5f65;display:grid;gap:2px;max-height:120px;overflow:auto}
.link{background:none;border:0;color:#7a2a4c;font-size:14px;text-decoration:underline;min-height:44px;justify-self:start;padding:0}
.toast{position:absolute;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 104px);transform:translate(-50%,-8px);z-index:7;background:rgba(0,0,0,.82);border:1px solid var(--line);border-radius:14px;padding:10px 16px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* 네일 전용 */
.nailart{width:150px;height:170px;position:relative;margin-bottom:6px}
.nailart i{position:absolute;bottom:0;width:38px;border-radius:19px 19px 8px 8px;background:linear-gradient(#f0cdb8,#d9a68b)}
.nailart i::before{content:"";position:absolute;left:6px;right:6px;top:7px;height:46%;border-radius:15px 15px 6px 6px;background:linear-gradient(160deg,#ff7a8c,#c8102e 60%,#8e0f2a);box-shadow:inset -3px 0 0 rgba(255,255,255,.35)}
.nailart i:nth-child(1){left:4px;height:120px;transform:rotate(-8deg)}.nailart i:nth-child(2){left:56px;height:150px}.nailart i:nth-child(3){left:108px;height:126px;transform:rotate(7deg)}
.card.add{display:grid;place-content:center;justify-items:center;gap:4px;border:2px dashed rgba(255,255,255,.35);background:rgba(255,255,255,.04);min-width:84px;font-weight:700;position:relative}
.card.add b{font-size:28px;line-height:1;font-weight:400}
.shapes{grid-template-columns:repeat(5,minmax(0,1fr))}
.cname .mute{color:var(--sub)}
.hop{color:#fff;opacity:.85;font-size:14px;text-decoration:underline;min-height:44px;display:inline-flex;align-items:center}
.chip.flipc[hidden]{display:none}
#status{white-space:normal;max-width:calc(100% - 132px);text-align:center;line-height:1.35}
</style>
</head>
<body>
<div class="app" id="app">
  <canvas id="cv" width="400" height="800" aria-label="네일 시안을 올린 손 사진"></canvas>

  <div class="top" id="top" hidden>
    <label class="chip">사진 바꾸기<input type="file" accept="image/*" class="pick"></label>
    <button class="chip cam" type="button">카메라</button>
    <button class="chip flipc" id="flipCam" type="button" hidden>앞뒤 전환</button>
    <span class="sp"></span>
    <button class="chip tok" id="tokBtn" type="button" aria-label="변신 토큰"><i class="coin"></i>토큰 <b id="tokTxt">10/10</b></button>
  </div>
  <div class="zoom" id="zoom" hidden><button type="button" id="zin" aria-label="확대">+</button><button type="button" id="zout" aria-label="축소">−</button><button type="button" id="zfit" aria-label="손에 맞추기">맞춤</button></div>
  <div id="status">손 인식 엔진 불러오는 중…</div>
  <div class="badge" id="badge" hidden></div>

  <div class="empty" id="empty">
    <div class="nailart" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1>네일 미러</h1>
    <p>손등이 보이게 손가락을 펴서 찍으면, 네일 시안을 손톱에 바로 올려보고 AI 변신으로 자연스럽게 다듬을 수 있어요.</p>
    <label class="btn">손 사진 올리기<input type="file" accept="image/*" class="pick"></label>
    <button class="btn ghost cam" type="button">실시간 카메라</button>
    <p class="tiny">사진은 이 기기 안에서만 처리돼요. ‘변신’을 누를 때만 그 화면 한 장이 AI로 보내져요.</p>
    <a class="hop" href="index.html">헤어 미러로 가기</a>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="tabs" role="tablist">
      <button role="tab" data-p="design" aria-selected="true">시안</button><button role="tab" data-p="color" aria-selected="false">컬러</button><button role="tab" data-p="shape" aria-selected="false">모양</button><button role="tab" data-p="cmp" aria-selected="false">비교</button>
    </div>
    <div class="pane" id="p-design"><div class="scroll" id="designs"></div></div>
    <div class="pane" id="p-color" hidden><div class="colors" id="colors"></div><p class="cname" id="cname"></p></div>
    <div class="pane" id="p-shape" hidden><div class="rows">
      <div class="seg shapes" id="shapes"></div>
      <div class="r"><button class="step" id="lminus" type="button" aria-label="짧게">−</button><input type="range" id="lr" min="0" max="1" step="0.01" value="0" aria-label="손톱 길이"><button class="step" id="lplus" type="button" aria-label="길게">+</button><output id="lrO">자연</output></div>
    </div></div>
    <div class="pane" id="p-cmp" hidden><div class="rows">
      <button class="holdbig" id="hold" type="button">누르고 있으면 원래 손</button>
      <div class="r"><span class="cmpl">좌우</span><input type="range" id="split" min="0" max="1" step="0.01" value="0" aria-label="좌우 비교"><span></span><output id="splitO">끔</output></div>
    </div></div>
    <div class="acts"><button class="morph" id="morph" type="button"><b id="morphB">변신하기</b><small id="morphS">AI 합성 · 토큰 1개</small></button><button class="save" id="save" type="button">저장</button></div>
  </div>

  <div class="sheet rsheet" id="rsheet" hidden>
    <p id="rnote"></p>
    <button class="holdbig" id="rhold" type="button">누르고 있으면 변신 전</button>
    <div class="three"><button class="soft" id="rback" type="button">다시 편집</button><button class="savebig" id="rsave" type="button">저장</button><button class="soft" id="ragain" type="button"><b id="ragB">다시 변신</b><small id="ragS">토큰 1개</small></button></div>
  </div>

  <div class="busy" id="busy" hidden><div class="ring"></div><b id="busyB"></b><span id="busyS"></span></div>
  <div class="modal" id="modal" hidden><div class="mcard" id="mcard" role="dialog" aria-modal="true"></div></div>
  <div class="toast" id="toast" role="status"></div>
</div>
<script src="config.js"></script>
<script src="mp/hand_assets.js"></script>
<script src="mp/hands.js"></script>
<script>
// 네일 엔진 — 손 랜드마크(21점) 위에 손톱 모양을 잡고, 시안(디자인)을 칠하고, 사진의 빛을 입힌다
const NAIL=(()=>{
const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
// 폴리시 색
const COLORS=[['로즈 레드','#c8102e'],['체리','#7d0f24'],['누드 베이지','#d6b49c'],['밀키 핑크','#f1c6cf'],['코랄','#f2685a'],['라벤더','#b49bd8'],
  ['스카이','#97c3e8'],['올리브','#7b8653'],['네이비','#1e2a4f'],['블랙','#141414'],['화이트','#f4f1ec'],['샴페인 골드','#d6b36a']].map(([n,h])=>({n,h,c:hx(h)}));
// 손가락: [가운데 마디, 끝마디(DIP·엄지는 IP), 끝(TIP)]
const FT=[[2,3,4],[6,7,8],[10,11,12],[14,15,16],[18,19,20]];
// 실제 손 사진으로 맞춘 값: 큐티클은 DIP→TIP의 42% 지점, 자연 길이 끝은 108%, 폭은 손가락 3D 길이의 비율
const A0=0.42,A1=1.08,WR=[0.5,0.44,0.45,0.43,0.4];
// 손톱 자리 (좌표계는 lm과 같음). len: 0~1 길이 연장, wid: 폭 배율
function geom(lm,f,o){const dp=lm[FT[f][1]],tp=lm[FT[f][2]],dx=tp[0]-dp[0],dy=tp[1]-dp[1],L=Math.hypot(dx,dy)||1,L3=Math.hypot(dx,dy,(tp[2]||0)-(dp[2]||0))||L;
  const ux=dx/L,uy=dy/L,l0=L*(A1-A0);
  return{bx:dp[0]+ux*L*A0,by:dp[1]+uy*L*A0,ux,uy,l0,len:l0+(o.len||0)*0.7*L,wid:L3*WR[f]*(o.wid||1),f}}
// 손톱 윤곽 (로컬 좌표: x 폭 방향 -w/2~w/2, y 큐티클 0 → 끝 l)
const SHAPES=[['round','라운드'],['oval','오벌'],['square','스퀘어'],['almond','아몬드'],['stiletto','스틸레토']];
function path(w,l,shape){const p=new Path2D(),h=w/2,c=Math.min(0.24*w,0.35*l);
  p.moveTo(-h,c);p.bezierCurveTo(-h,0.25*c,-0.55*h,0,0,0);p.bezierCurveTo(0.55*h,0,h,0.25*c,h,c);
  if(shape==='square'){const t=Math.min(0.14*w,0.3*l);p.lineTo(h,l-t);p.quadraticCurveTo(h,l,h-t,l);p.lineTo(-h+t,l);p.quadraticCurveTo(-h,l,-h,l-t)}
  else if(shape==='almond'||shape==='stiletto'){const ys=c+(shape==='almond'?0.3:0.12)*(l-c),k=shape==='almond'?0.32:0.06;
    p.lineTo(h,ys);p.bezierCurveTo(h,ys+0.55*(l-ys),k*h+0.25*h*(shape==='almond'),l,0,l);p.bezierCurveTo(-(k*h+0.25*h*(shape==='almond')),l,-h,ys+0.55*(l-ys),-h,ys)}
  else{const t=shape==='oval'?Math.min(0.62*w,0.6*l):Math.min(0.42*w,0.55*l),s=shape==='oval'?0.93:1;
    p.lineTo(h*s,l-t);p.bezierCurveTo(h*s,l-0.45*t,0.55*h,l,0,l);p.bezierCurveTo(-0.55*h,l,-h*s,l-0.45*t,-h*s,l-t)}
  p.closePath();return p}
// 반복해도 같은 결과가 나오는 난수 (손톱마다 글리터·마블 무늬가 매 프레임 바뀌지 않게)
function rnd(seed){let s=seed*2654435761>>>0||1;return()=>((s=Math.imul(s^s>>>15,2246822507)^Math.imul(s^s>>>13,3266489909),(s^=s>>>16)>>>0)/4294967296)}
// 시안: paint(g,w,l,색,손가락,씨앗,l0,내 사진) — 로컬 좌표에서 손톱 영역(이미 잘라냄)을 칠한다
const nude=[241,210,200];
function fill(g,w,l,c,a=1){g.fillStyle=rgb(c,a);g.fillRect(-w,-l*0.2,2*w,l*1.4)}
function heart(g,x,y,s,c){g.fillStyle=rgb(c);g.beginPath();g.moveTo(x,y+0.35*s);g.bezierCurveTo(x-0.9*s,y-0.25*s,x-0.35*s,y-0.9*s,x,y-0.35*s);g.bezierCurveTo(x+0.35*s,y-0.9*s,x+0.9*s,y-0.25*s,x,y+0.35*s);g.fill()}
const DESIGNS=[
  {id:'solid',n:'원컬러',paint:(g,w,l,c)=>fill(g,w,l,c)},
  {id:'french',n:'프렌치',paint:(g,w,l,c,f,s,l0)=>{fill(g,w,l,[246,216,214],0.82);const h=w/2,y0=l0*0.74,k=l0*0.14;
    g.fillStyle=rgb(c[0]+c[1]+c[2]>600?[250,248,244]:c);g.beginPath();g.moveTo(-w,l*1.2);g.lineTo(-w,y0);
    for(let i=0;i<=16;i++){const x=-h+i*w/16,t=x/h;g.lineTo(x,y0+k*(1-t*t))}g.lineTo(w,y0);g.lineTo(w,l*1.2);g.closePath();g.fill()}},
  {id:'ombre',n:'그라데이션',paint:(g,w,l,c)=>{fill(g,w,l,nude,0.7);const gr=g.createLinearGradient(0,l*0.22,0,l*0.92);gr.addColorStop(0,rgb(c,0));gr.addColorStop(0.55,rgb(c,0.75));gr.addColorStop(1,rgb(c,1));g.fillStyle=gr;g.fillRect(-w,-l*0.2,2*w,l*1.4)}},
  {id:'glitter',n:'글리터',paint:(g,w,l,c,f,s)=>{fill(g,w,l,mix(c,[0,0,0],0.15));const r=rnd(s+7),n=Math.round(w*l/9)+30;
    for(let i=0;i<n;i++){const x=(r()-0.5)*w,y=r()*l,z=0.6+r()*Math.max(1.2,w*0.035),b=r();g.fillStyle=b>0.55?'rgba(255,255,255,.95)':b>0.3?rgb(mix(c,[255,240,200],0.6),0.95):'rgba(255,215,140,.9)';g.fillRect(x,y,z,z)}}},
  {id:'magnet',n:'자석',paint:(g,w,l,c)=>{const d=mix(c,[0,0,0],0.55);fill(g,w,l,d);const gr=g.createLinearGradient(-w*0.6,l*0.15,w*0.6,l*0.85);
    gr.addColorStop(0,rgb(d,0));gr.addColorStop(0.42,rgb(mix(c,[255,255,255],0.25),0.15));gr.addColorStop(0.5,rgb(mix(c,[255,255,255],0.55),0.95));gr.addColorStop(0.58,rgb(mix(c,[255,255,255],0.25),0.15));gr.addColorStop(1,rgb(d,0));g.fillStyle=gr;g.fillRect(-w,-l*0.2,2*w,l*1.4)}},
  {id:'marble',n:'마블',paint:(g,w,l,c,f,s)=>{fill(g,w,l,[246,244,240]);const r=rnd(s+3);g.lineCap='round';
    for(let i=0;i<4;i++){g.strokeStyle=rgb(i%2?mix(c,[255,255,255],0.35):mix(c,[0,0,0],0.1),0.55+r()*0.35);g.lineWidth=Math.max(0.6,w*(0.02+r()*0.05));g.beginPath();
      let x=(r()-0.5)*w,y=-l*0.1;g.moveTo(x,y);for(let k=0;k<4;k++){const nx=(r()-0.5)*w*1.2,ny=y+l*(0.25+r()*0.2);g.quadraticCurveTo((x+nx)/2+(r()-0.5)*w*0.6,(y+ny)/2,nx,ny);x=nx;y=ny}g.stroke()}}},
  {id:'chrome',n:'크롬',paint:(g,w,l,c)=>{const gr=g.createLinearGradient(-w/2,0,w/2,0),lt=mix(c,[255,255,255],0.75),dk=mix(c,[0,0,0],0.45);
    gr.addColorStop(0,rgb(dk));gr.addColorStop(0.28,rgb(lt));gr.addColorStop(0.45,rgb(mix(c,[255,255,255],0.2)));gr.addColorStop(0.7,rgb(dk));gr.addColorStop(0.9,rgb(lt));gr.addColorStop(1,rgb(mix(c,[0,0,0],0.3)));g.fillStyle=gr;g.fillRect(-w,-l*0.2,2*w,l*1.4)}},
  {id:'heart',n:'하트 포인트',paint:(g,w,l,c,f,s,l0)=>{if(f===3||f===0){fill(g,w,l,[246,222,220]);heart(g,0,l0*0.55,w*0.22,c)}else fill(g,w,l,c)}},
  {id:'mine',n:'내 시안',mine:true,paint:(g,w,l,c,f,s,l0,img)=>{if(!img){fill(g,w,l,[230,225,222]);return}const iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height,k=Math.max(w/iw,l/ih);
    g.drawImage(img,-iw*k/2,l/2-ih*k/2,iw*k,ih*k)}}
];
const byId=id=>DESIGNS.find(d=>d.id===id)||DESIGNS[0];
// 사진의 빛(밝기 흐름)을 손톱 자리에서 8×12로 재서 4×6 회색 지도로 — 오버레이로 입혀 실제 조명을 따라가게
const smp=document.createElement('canvas');smp.width=8;smp.height=12;const sg=smp.getContext('2d',{willReadFrequently:true});
function light(src,G){const w=G.wid,l=G.l0,nx=-G.uy,ny=G.ux,kx=8/(1.3*w),ky=12/(1.2*l);
  sg.setTransform(1,0,0,1,0,0);sg.clearRect(0,0,8,12);
  sg.setTransform(kx*nx,ky*G.ux,kx*ny,ky*G.uy,-kx*(nx*G.bx+ny*G.by)+4,-ky*(G.ux*G.bx+G.uy*G.by)+0.1*l*ky);
  sg.imageSmoothingQuality='high';try{sg.drawImage(src,0,0)}catch(e){return null}
  let d;try{d=sg.getImageData(0,0,8,12).data}catch(e){return null}
  const v=[];let m=0,n=0;for(let j=0;j<6;j++)for(let i=0;i<4;i++){let s=0,a=0;for(const[di,dj]of[[0,0],[1,0],[0,1],[1,1]]){const k=((2*j+dj)*8+2*i+di)*4;if(d[k+3]>200){s+=0.299*d[k]+0.587*d[k+1]+0.114*d[k+2];a++}}
    const y=a?s/a:NaN;v.push(y);if(a){m+=y;n++}}
  if(!n)return null;m/=n;const c=document.createElement('canvas');c.width=4;c.height=6;const cg=c.getContext('2d'),im=cg.createImageData(4,6);
  v.forEach((y,i)=>{const t=Number.isNaN(y)?1:Math.min(1.22,Math.max(0.78,y/m)),g=Math.round(128*t);im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=g;im.data[i*4+3]=255});
  cg.putImageData(im,0,0);return{c,mean:m/255,side:(v[0]+v[4]+v[8]+v[12]+v[16]+v[20])>(v[3]+v[7]+v[11]+v[15]+v[19]+v[23])?-1:1}}
// 손톱 하나 그리기. G: 화면 좌표의 자리, o: {design,color,shape,seed,img,light,bright}
function draw(g,G,o){const w=G.wid,l=G.len,D=byId(o.design),pth=path(w,l,o.shape);
  g.save();g.setTransform(-G.uy*o.k,G.ux*o.k,G.ux*o.k,G.uy*o.k,G.bx,G.by);   // o.k: 화면 배율(로컬 단위 = 이미지 픽셀)
  g.save();g.clip(pth);D.paint(g,w,l,o.color,G.f,o.seed,G.l0,o.img);
  const L=o.light;
  if(L){g.globalCompositeOperation='overlay';g.globalAlpha=D.mine?0.45:0.6;g.imageSmoothingEnabled=true;g.drawImage(L.c,-0.65*w,-0.1*G.l0,1.3*w,1.2*G.l0);g.imageSmoothingEnabled=true}
  if(o.bright&&o.bright<0.99){g.globalCompositeOperation='multiply';g.globalAlpha=1;const b=Math.round(255*o.bright);g.fillStyle=`rgb(${b},${b},${b})`;g.fillRect(-w,-l*0.2,2*w,l*1.4)}

  g.globalCompositeOperation='source-over';g.globalAlpha=1;const e=g.createLinearGradient(-w/2,0,w/2,0);
  e.addColorStop(0,'rgba(0,0,0,.26)');e.addColorStop(0.2,'rgba(0,0,0,0)');e.addColorStop(0.8,'rgba(0,0,0,0)');e.addColorStop(1,'rgba(0,0,0,.26)');g.fillStyle=e;g.fillRect(-w,-l*0.2,2*w,l*1.4);
  // 광택: 빛이 오는 쪽에 길쭉한 하이라이트
  const sx=(L?L.side:-1)*0.2*w;g.globalCompositeOperation='screen';const hl=g.createLinearGradient(0,l*0.1,0,l*0.8);
  hl.addColorStop(0,'rgba(255,255,255,0)');hl.addColorStop(0.3,'rgba(255,255,255,.5)');hl.addColorStop(0.75,'rgba(255,255,255,.18)');hl.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=hl;g.beginPath();g.ellipse(sx,l*0.45,Math.max(0.6,w*0.07),l*0.34,0,0,7);g.fill();
  g.globalAlpha=0.35;g.beginPath();g.ellipse(-sx*0.6,l*0.2,Math.max(0.5,w*0.05),l*0.08,0,0,7);g.fill();
  g.restore();
  // 테두리: 큐티클 쪽 그늘
  g.globalAlpha=1;g.lineWidth=Math.max(0.6,w*0.025);g.strokeStyle='rgba(70,35,30,.28)';g.stroke(pth);g.restore()}
// 카드용 미리보기: 피부색 바탕에 손톱 세 개
function thumb(cv,design,color,shape,img){const g=cv.getContext('2d'),W=cv.width,H=cv.height;g.setTransform(1,0,0,1,0,0);
  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#f0d3c2');bg.addColorStop(1,'#dcae96');g.fillStyle=bg;g.fillRect(0,0,W,H);
  const lens=[0.62,0.7,0.6];[-1,0,1].forEach((s,i)=>{const w=W*0.22,l=H*lens[i]*(shape==='almond'||shape==='stiletto'?1.05:0.9),bx=W/2+s*W*0.29,by=H*0.92-l*(i===1?1.08:1);
    g.fillStyle='#e7bea6';g.beginPath();g.ellipse(bx,by+l*0.55,w*0.68,l*0.75,0,0,7);g.fill();
    draw(g,{bx,by:by+l,ux:0,uy:-1,wid:w,len:l,l0:l,f:[1,2,3][i]},{design,color,shape,seed:i+1,img,light:null,k:1})})}

<script>
{
// ================= 설정 =================
// AI 서버 주소는 config.js 의 aiUrl (헤어 미러와 같은 서버·같은 토큰). 비어 있으면 '체험 모드'
const AI_URL=String((window.HM_CONFIG&&window.HM_CONFIG.aiUrl)||'').trim().replace(/\/+$/,'');
const TOKEN_LIMIT=10;
const LOADING='손 인식 엔진 불러오는 중…',FIND='손 찾는 중…';

const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),status=$('status');
const st={design:'solid',ci:0,shape:'round',len:0,split:0,hold:false};
let src=null,hands=[],mode='none',video=null,busy=false,hm=null,ready=false,frame=0,detecting=false,facing='environment';
let iw=0,ih=0,view={z:1,tx:0,ty:0,auto:true},camFit=false,srcF=null,result=null,morphing=false,mine=null;
const LC=new Map();   // 손톱별 빛 지도 캐시 (사진일 때)
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function say(t){status.textContent=t}
let tt=0;function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2600)}

// ================= 화면: 확대·이동, 사진 밖 배경 =================
const bd=mk(24,24),bdg=bd.getContext('2d',{willReadFrequently:true});let topL='0,0,0',topR='0,0,0';
function makeBackdrop(){if(!src||!iw)return;const w=24,h=Math.max(8,Math.round(24*ih/iw));if(bd.width!==w||bd.height!==h){bd.width=w;bd.height=h}
  bdg.imageSmoothingQuality='high';bdg.drawImage(src,0,0,w,h);
  try{const d=bdg.getImageData(0,0,w,2).data,avg=(a,b)=>{let r=0,g=0,c=0,n=0;for(let y=0;y<2;y++)for(let x=a;x<b;x++){const i=(y*w+x)*4;r+=d[i];g+=d[i+1];c+=d[i+2];n++}return[r/n|0,g/n|0,c/n|0].join(',')};
    topL=avg(0,3);topR=avg(w-3,w)}catch(e){}}
function backdrop(g){const cw=g.canvas.width,ch=g.canvas.height,{z,tx,ty}=view,w=iw*z,h=ih*z,bw=bd.width,bh=bd.height,r=tx+w,b=ty+h;
  g.imageSmoothingEnabled=true;g.drawImage(bd,tx,ty,w,h);
  const D=(sx,sy,sw,sh,dx,dy,dw,dh)=>{if(dw>0.5&&dh>0.5)g.drawImage(bd,sx,sy,sw,sh,dx,dy,dw,dh)};
  D(0,bh-1,bw,1,tx,b,w,ch-b);D(0,0,1,bh,0,ty,tx,h);D(bw-1,0,1,bh,r,ty,cw-r,h);D(0,bh-1,1,1,0,b,tx,ch-b);D(bw-1,bh-1,1,1,r,b,cw-r,ch-b);
  if(ty>0.5){const gr=g.createLinearGradient(tx,0,r,0);gr.addColorStop(0,`rgb(${topL})`);gr.addColorStop(1,`rgb(${topR})`);g.fillStyle=gr;g.fillRect(0,0,cw,ty+1)}}
function paintBase(g){g.setTransform(1,0,0,1,0,0);backdrop(g);g.setTransform(view.z,0,0,view.z,view.tx,view.ty);g.imageSmoothingQuality='high';
  g.drawImage(mode==='photo'&&srcF||src,0,0,iw,ih);g.setTransform(1,0,0,1,0,0)}
const zc=()=>Math.min(cv.width/iw,cv.height/ih);
// 편집판·위쪽 바에 가리지 않는 사진 영역(캔버스 픽셀)
function visible(){const r=cv.getBoundingClientRect();if(!r.height)return{y0:0,y1:cv.height};const k=cv.height/r.height,top=$('top');
  const y0=top.hidden?0:(top.getBoundingClientRect().bottom-r.top-8)*k,sh=[$('sheet'),$('rsheet')].find(e=>!e.hidden),y1=sh?(sh.getBoundingClientRect().top-r.top)*k:cv.height;

function handsBox(){if(!hands.length)return null;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;

    for(let f=0;f<5;f++){const n=NAIL.geom(h.lm,f,{len:st.len}),ex=n.bx+n.ux*n.len,ey=n.by+n.uy*n.len;x0=Math.min(x0,ex);y0=Math.min(y0,ey);x1=Math.max(x1,ex);y1=Math.max(y1,ey)}}
  return{x:x0,y:y0,w:x1-x0,h:y1-y0}}

  if(B){const pad=0.1*Math.max(B.w,B.h)+8,w=B.w+2*pad,h=B.h+2*pad,z=Math.min(cw/w,vh/h,zc()*4);view={z,tx:cw/2-(B.x+B.w/2)*z,ty:(y0+y1)/2-(B.y+B.h/2)*z,auto:true}}
  else{const z=Math.min(cw/iw,vh/ih);view={z,tx:(cw-iw*z)/2,ty:y0+(vh-ih*z)/2,auto:true}}}
function zoomAt(c,z){if(!src||result)return;const k=zc();z=Math.min(k*12,Math.max(k*0.45,z));const ix=(c.x-view.tx)/view.z,iy=(c.y-view.ty)/view.z;
  view={z,tx:c.x-ix*z,ty:c.y-iy*z,auto:false};render()}
const refit=()=>{if(view.auto&&src){fitView();render()}};

// ================= 손톱 그리기 =================
function lightFor(h,hi,f,n){const k=hi*5+f;if(mode==='photo'&&LC.has(k))return LC.get(k);const L=NAIL.light(src,n);if(mode==='photo')LC.set(k,L);return L}
function drawNails(g){if(!hands.length)return;const{z,tx,ty}=view,color=NAIL.COLORS[st.ci].c;
  hands.forEach((h,hi)=>{const G=[0,1,2,3,4].map(f=>NAIL.geom(h.lm,f,{len:st.len})),Ls=G.map((n,f)=>lightFor(h,hi,f,n));
    // 사진이 어두우면 손톱도 그만큼 어둡게 (밝히지는 않음)
    const ms=Ls.filter(Boolean).map(L=>L.mean),m=ms.length?ms.reduce((a,b)=>a+b)/ms.length:0.6,bright=Math.min(1,Math.max(0.55,Math.pow(m/0.6,0.8)));

  const nodes=[el('h2',null,out?'토큰을 모두 썼어요':'변신 토큰'),dots(false),
    el('p',null,out?`변신은 토큰 ${Tok.limit}개까지만 할 수 있어요. 남은 토큰이 없어서 지금은 변신이 동작하지 않아요. 시안 고르기·색·모양 바꾸기는 계속 쓸 수 있어요.`
      :`변신 1번에 토큰 1개가 차감돼요. 헤어 미러와 같이 써서 모두 ${Tok.limit}개이고, 다 쓰면 변신 버튼이 멈춰요.`),
    el('p','note',AI_URL?`토큰은 AI 서버가 직접 세고, ${Tok.limit}개를 다 쓰면 서버가 합성을 거절해요.`:Tok.where==='db'?'토큰 기록은 계정에 저장돼서 새로고침하거나 다른 기기에서 열어도 그대로예요.':'토큰 기록은 이 브라우저에 저장돼요.'),modeNote()];
  if(Tok.log.length)nodes.push(el('p',null,'사용 기록'),list);
  const w=el('div','mbtns one'),c=el('button',null,'닫기');c.type='button';c.onclick=closeModal;w.append(c);nodes.push(w);
  if(!AI_URL&&(Tok.owner||!window.claude)){const r=el('button','link',`테스트용: 토큰 ${TOKEN_LIMIT}개 다시 채우기 (${Tok.owner?'만든 사람에게만 보여요':'체험 모드 전용'})`);r.type='button';
    r.onclick=async()=>{await refill();closeModal();toast(`토큰을 ${TOKEN_LIMIT}개로 다시 채웠어요`)};nodes.push(r)}
  openModal(nodes)}
$('tokBtn').onclick=()=>openTokens(Tok.ready&&left()<=0);

// ================= 변신 =================
function busyOn(b,s){$('busyB').textContent=b;$('busyS').textContent=s;$('busy').hidden=false}
function busyOff(){$('busy').hidden=true}
function loadImg(url){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url})}
function snapshot(){const c=mk(cv.width,cv.height),g=c.getContext('2d');composeTo(g);return c}
function exportRect(){const{y0,y1}=visible(),W=cv.width,H=cv.height;let w=W,h=Math.round(W*4/3);if(h>H){h=H;w=Math.round(H*3/4)}
  const y=Math.max(0,Math.min(H-h,Math.round((y0+y1)/2-h/2)));return{x:Math.round((W-w)/2),y,w,h,ar:'3:4'}}
function renderExport(R){const f=Math.max(1,Math.min(2048/R.h,1/view.z)),c=mk(R.w*f,R.h*f),g=c.getContext('2d'),keep=view;
  view={z:view.z*f,tx:(view.tx-R.x)*f,ty:(view.ty-R.y)*f,auto:false};try{composeTo(g)}finally{view=keep}return c}
// 체험 모드: 기기 안에서 하는 간단 보정 — 손톱 아래 그림자, 경계 다듬기, 사진 입자
function harmonize(){const cw=cv.width,ch=cv.height,u=cw/400;
  const base=mk(cw,ch);paintBase(base.getContext('2d'));const nl=mk(cw,ch);drawNails(nl.getContext('2d'));
  const out=mk(cw,ch),g=out.getContext('2d');g.drawImage(base,0,0);
  g.save();g.globalAlpha=0.28;g.filter=`blur(${(1.4*u).toFixed(1)}px) brightness(0)`;g.drawImage(nl,0.4*u,0.9*u);g.restore();
  g.save();g.filter=`blur(${(0.45*u).toFixed(1)}px)`;g.drawImage(nl,0,0);g.restore();g.globalAlpha=0.8;g.drawImage(nl,0,0);g.globalAlpha=1;
  const n=mk(128,128),ng=n.getContext('2d'),nd=ng.createImageData(128,128);for(let i=0;i<nd.data.length;i+=4){const v=96+Math.random()*64|0;nd.data[i]=nd.data[i+1]=nd.data[i+2]=v;nd.data[i+3]=255}ng.putImageData(nd,0,0);
  g.save();g.globalCompositeOperation='overlay';g.globalAlpha=0.08;g.fillStyle=g.createPattern(n,'repeat');g.fillRect(0,0,cw,ch);g.restore();return out}
function showResult(img,rect,full,before,demo,crop){result={img,rect,full,before,demo,crop};$('sheet').hidden=true;$('rsheet').hidden=false;$('zoom').hidden=true;
  const b=$('badge');b.hidden=false;b.textContent=demo?'체험 모드 결과':'AI 변신 결과';b.classList.toggle('demo',demo);
  $('rnote').textContent=demo?'체험 모드 결과예요. 실제 AI 서버를 연결하면 이 자리에 AI가 새로 그린 사진이 나와요.':'AI가 다시 그린 사진이에요. 마음에 안 들면 다시 변신해 보세요 (토큰 1개).';render()}
function exitResult(silent){if(!result)return;result=null;$('rsheet').hidden=true;$('badge').hidden=true;if(src){$('sheet').hidden=false;$('zoom').hidden=false}st.hold=false;if(!silent)render()}
$('rback').onclick=()=>exitResult();
$('ragain').onclick=()=>{exitResult();if(left()<=0){openTokens(true);return}openConfirm()};
$('morph').onclick=()=>{if(!Tok.ready)return;if(left()<=0){openTokens(true);return}
  if(!src||!hands.length){toast('먼저 손이 나온 사진을 올려주세요');return}openConfirm()};
async function doMorph(){closeModal();if(morphing||!hands.length||left()<=0)return;morphing=true;const before=snapshot();
  if(AI_URL){busyOn('AI가 손톱을 다시 그리는 중…','토큰 1개를 사용해요 · 10~30초쯤 걸려요');
    const R=exportRect(),big=renderExport(R),k=Math.min(1,1024/Math.max(big.width,big.height)),crop=mk(big.width*k,big.height*k);crop.getContext('2d').drawImage(big,0,0,crop.width,crop.height);
    try{let body=crop.toDataURL('image/jpeg',0.9).split(',')[1];
      if(mine&&st.design==='mine'){const kk=Math.min(1,768/Math.max(mine.width,mine.height)),rc=mk(mine.width*kk,mine.height*kk);rc.getContext('2d').drawImage(mine,0,0,rc.width,rc.height);body+=','+rc.toDataURL('image/jpeg',0.88).split(',')[1]}
      const r=await fetch(`${AI_URL}/transform?kind=nail&device=${encodeURIComponent(devId())}&aspect=${encodeURIComponent(R.ar)}`,{method:'POST',headers:{'content-type':'text/plain'},body});
      const hu=r.headers.get('x-tokens-used');if(hu!=null){Tok.used=+hu||0;Tok.limit=+r.headers.get('x-tokens-limit')||Tok.limit;tokUI()}
      const j=await r.json().catch(()=>({}));
      if(!r.ok&&typeof j.used==='number'){Tok.used=j.used;Tok.limit=j.limit||Tok.limit;tokUI()}
      const parts=(j&&j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[],
        pics=parts.filter(p=>p&&!p.thought&&(p.inlineData||p.inline_data)),part=pics[pics.length-1],d=part&&(part.inlineData||part.inline_data);
      if(r.ok&&d&&typeof d.data==='string'){const mt=/^image\/(png|jpeg|webp)$/.test(d.mimeType||d.mime_type||'')?(d.mimeType||d.mime_type):'image/png';
        const img=await loadImg(`data:${mt};base64,${d.data}`);busyOff();showResult(img,R,before,before,false,R);toast(`토큰 1개 사용 · 남은 토큰 ${left()}/${Tok.limit}`)}
      else{busyOff();if(j.error==='no_tokens')openTokens(true);
        else toast(j.error==='daily_limit'?'오늘 AI 변신이 모두 마감됐어요. 내일 다시 해 주세요 (토큰은 그대로예요)':j.error==='busy'?'잠시 후 다시 해 주세요 (토큰은 그대로예요)':j.refunded?'AI 합성에 실패해서 토큰을 돌려드렸어요':'AI 합성에 실패했어요')}}
    catch(e){busyOff();toast('AI 서버에 연결하지 못했어요');tokInit()}}
  else{const R=exportRect(),a=await spend('체험');busyOn('자연스럽게 다시 합성하는 중…',`토큰 1개 사용 · 남은 토큰 ${left()}개`);
    const t0=performance.now();let out=null;try{out=harmonize()}catch(e){}
    await wait(Math.max(0,900-(performance.now()-t0)));busyOff();
    if(out){showResult(out,{x:0,y:0,w:cv.width,h:cv.height},out,before,true,R);toast(`토큰 1개 사용 · 남은 토큰 ${left()}/${Tok.limit}`)}
    else{await refund(a);toast('합성에 실패해서 토큰을 돌려드렸어요')}}
  morphing=false}

// ================= 저장 =================
const stamp=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return`${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`};
function exportCanvas(){let srcC,R;
  if(result&&!result.demo){const im=result.img;srcC=im;R={x:0,y:0,w:im.naturalWidth||im.width,h:im.naturalHeight||im.height}}
  else if(result){srcC=result.full;R=result.crop}
  else{const E=exportRect();srcC=renderExport(E);R={x:0,y:0,w:srcC.width,h:srcC.height}}
  const c=mk(R.w,R.h),g=c.getContext('2d');
  if(cv.classList.contains('flip')){g.translate(c.width,0);g.scale(-1,1)}
  g.drawImage(srcC,R.x,R.y,R.w,R.h,0,0,c.width,c.height);return c}
let dlCap;const dlReady=window.claude&&typeof window.claude.use==='function'?window.claude.use('downloads').then(d=>dlCap=d).catch(()=>dlCap=null):Promise.resolve(dlCap=null);
async function saveImage(){if(!src){toast('먼저 사진을 올려주세요');return}
  const c=exportCanvas(),blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.92));if(!blob){toast('저장할 이미지를 만들지 못했어요');return}
  const name=`nail-mirror-${stamp()}${result?(result.demo?'-trial':'-ai'):''}.jpg`;
  if(window.claude){await dlReady;
    if(!dlCap){toast('이 화면에서는 저장할 수 없어요');return}
    try{const r=await dlCap.save({filename:name,data:blob});if(r&&r.status==='saved')toast('사진을 저장했어요')}
    catch(e){const k=e&&e.code;toast(k==='declined'?'저장을 취소했어요':k==='rate_limited'?'잠시 후 다시 눌러주세요':k==='host_unavailable'?'이 앱에서는 저장이 안 돼요. 브라우저에서 열어 주세요':'저장하지 못했어요')}
    return}
  const file=new File([blob],name,{type:'image/jpeg'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'네일 미러'});return}catch(e){if(e&&e.name==='AbortError')return}}
  const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast('사진을 저장했어요')}
$('save').onclick=saveImage;$('rsave').onclick=saveImage;

sync();thumbs();tokInit();
}
</script>
