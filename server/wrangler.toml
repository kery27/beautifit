name = "hair-mirror-ai"
main = "worker.js"
compatibility_date = "2026-11-01"

# 기기별 토큰 사용량을 저장하는 KV
# 만들기: npx wrangler kv namespace create TOKENS  → 나온 id 를 아래에 붙여넣기
[[kv_namespaces]]
binding = "TOKENS"
id = "여기에_KV_네임스페이스_ID"

[vars]
# 앱을 올린 주소. 다른 사이트의 웹페이지가 이 서버를 부르지 못하게 한다
ALLOW_ORIGIN = "https://kery27.github.io"
# 이미지 편집 모델 (절반 값에 더 빠른 쪽을 원하면 gemini-3.1-flash-lite-image)
MODEL = "gemini-3.1-flash-image"
# 기기 하나당 변신 토큰 수
TOKEN_LIMIT = "10"
# 하루(한국 시간) 전체 변신 상한. 서버 주소는 공개돼 있으니 요금 폭탄을 막는 안전장치 (0 = 상한 없음)
DAILY_LIMIT = "100"
# 결과 사진 크기를 바꿀 때만 주석을 풀기: "512"(싸고 작게) / "2K"(크고 비싸게). 기본은 1K
# IMAGE_SIZE = "512"

# 비밀값은 여기 쓰지 말고 명령으로 넣기:
#   npx wrangler secret put GEMINI_API_KEY   (Google AI Studio 에서 발급, 결제 등록 필요)
#   npx wrangler secret put ADMIN_KEY        (선택: 테스트용 토큰 초기화 /reset 에 쓰는 암호)
